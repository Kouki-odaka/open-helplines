# composite action: validate-country
# Validates JSON data for one ISO 3166-1 alpha-2 country code.
# Called by the validate-matrix fan-out job in _validate.yml.
# Assumes packages/core has already been built (dist/cli.js exists).
name: Validate country data
description: Run JSON Schema validation for a single country directory

inputs:
  country:
    description: ISO 3166-1 alpha-2 country code (lowercase), e.g. jp
    required: true
  schema-path:
    description: Path to JSON Schema file
    default: schemas/helpline.schema.json

outputs:
  result:
    description: 'Validation outcome: pass | skip | fail'
    value: ${{ steps.validate.outputs.result }}

runs:
  using: composite
  steps:
    - name: Check data directory exists for ${{ inputs.country }}
      id: check-dir
      shell: bash
      run: |
        dir="data/countries/${{ inputs.country }}"
        if [ ! -d "$dir" ] || [ -z "$(ls -A "$dir" 2>/dev/null | grep -v '.gitkeep')" ]; then
          echo "::notice::No data files found for ${{ inputs.country }} — skipping validation"
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Data directory: $dir"
          ls -la "$dir"
        fi

    - name: Validate ${{ inputs.country }} against JSON Schema
      id: validate
      if: steps.check-dir.outputs.skip == 'false'
      shell: bash
      run: |
        output_file="validation-${{ inputs.country }}.json"
        set +e
        node packages/core/dist/cli.js validate \
          --country "${{ inputs.country }}" \
          --schema "${{ inputs.schema-path }}" \
          --output json \
          > "$output_file" 2>&1
        exit_code=$?
        set -e
        if [ $exit_code -eq 0 ]; then
          echo "result=pass" >> "$GITHUB_OUTPUT"
          echo "✅ ${{ inputs.country }}: PASS"
        else
          echo "result=fail" >> "$GITHUB_OUTPUT"
          echo "❌ ${{ inputs.country }}: FAIL"
          cat "$output_file"
          exit 1
        fi

    - name: Record skip result
      if: steps.check-dir.outputs.skip == 'true'
      shell: bash
      run: |
        echo '{"country":"${{ inputs.country }}","status":"skip","errors":[]}' \
          > "validation-${{ inputs.country }}.json"
        echo "result=skip" >> "$GITHUB_ENV"

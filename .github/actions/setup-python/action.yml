# composite action: setup-python
# Installs Python + restores pip cache + installs packages/python in editable mode.
# Used by _validate.yml (cross-cutting job) and _publish.yml (pypi target).
name: Setup Python with pip cache
description: Install Python, restore pip cache, and install open-helplines[dev] — shared composite action

inputs:
  python-version:
    description: Python version to use
    default: '3.12'

runs:
  using: composite
  steps:
    - name: Setup Python ${{ inputs.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Restore pip cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/pip
        key: pip-${{ runner.os }}-${{ inputs.python-version }}-${{ hashFiles('packages/python/pyproject.toml') }}
        restore-keys: |
          pip-${{ runner.os }}-${{ inputs.python-version }}-

    - name: Install Python package (editable + dev extras)
      shell: bash
      run: pip install --quiet -e "packages/python[dev]"

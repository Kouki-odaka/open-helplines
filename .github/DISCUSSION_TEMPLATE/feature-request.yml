title: "[Idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Share an idea or feature request. Please search existing discussions first.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the problem or use-case.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature you'd like to see.
    validations:
      required: true

# gitleaks.yml — Secret scanning via Gitleaks
#
# Scans every push and pull_request for accidentally committed secrets.
# Uses the official gitleaks/gitleaks-action — no extra configuration needed
# for default patterns (API keys, tokens, credentials).
#
# Design patterns:
#   Supply Chain: pinned to SHA, not mutable tag
#   Fail-Fast   : hard failure on detected secrets (exit 1 default)
#   Bulkhead    : only runs on push/PR — no cron to avoid noisy false-positives

name: Secret Scan (Gitleaks)

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan for leaked secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0  # Full history — detect secrets in any commit, not just HEAD

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # Optional: set for team features

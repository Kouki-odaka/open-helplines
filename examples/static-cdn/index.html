<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>open-helplines browser example</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    select, button { font-size: 1rem; padding: 0.4rem 0.8rem; margin-right: 0.5rem; }
    button { cursor: pointer; }
    #results { margin-top: 1.5rem; }
    .card { border: 1px solid #ddd; border-radius: 6px; padding: 1rem; margin-bottom: 1rem; }
    .card h3 { margin: 0 0 0.4rem; }
    .contact { background: #f5f5f5; border-radius: 4px; padding: 0.4rem 0.6rem; margin: 0.4rem 0; font-family: monospace; }
    .meta { font-size: 0.85rem; color: #666; margin-top: 0.5rem; }
    .warning { background: #fff3cd; border: 1px solid #ffc107; border-radius: 6px; padding: 0.8rem 1rem; margin-bottom: 1rem; }
  </style>
</head>
<body>

<h1>open-helplines — browser demo</h1>

<div class="warning">
  <strong>Emergency?</strong> Call local emergency services first (911, 119, 999…).
  This page shows a directory — it is not a crisis service.
</div>

<label for="country">Country (ISO alpha-2):</label>
<select id="country">
  <option value="au">AU — Australia</option>
  <option value="br">BR — Brazil</option>
  <option value="ca">CA — Canada</option>
  <option value="de">DE — Germany</option>
  <option value="gb">GB — United Kingdom</option>
  <option value="in">IN — India</option>
  <option value="jp" selected>JP — Japan</option>
  <option value="kr">KR — South Korea</option>
  <option value="nz">NZ — New Zealand</option>
  <option value="us">US — United States</option>
  <option value="za">ZA — South Africa</option>
</select>
<button onclick="load()">Find helplines</button>

<div id="results"></div>

<script>
  const REGISTRY_BASE =
    "https://raw.githubusercontent.com/Kouki-odaka/open-helplines/main/data";

  /**
   * Fetch all helpline records for a country.
   * Returns an empty array if the country is not yet in the registry.
   *
   * Contact info is returned verbatim — never generated or inferred.
   */
  async function fetchHelplines(countryCode) {
    const url = `${REGISTRY_BASE}/countries/${countryCode}/index.json`;
    const res = await fetch(url);
    if (!res.ok) return [];
    return res.json();
  }

  function renderContact(contact) {
    const reach =
      contact.method === "phone" || contact.method === "text"
        ? contact.number
        : contact.url;
    const callOrLink =
      contact.method === "phone"
        ? `<a href="tel:${contact.number}">${contact.number}</a>`
        : contact.method === "chat" || contact.method === "email" || contact.method === "app"
        ? `<a href="${contact.url}" target="_blank" rel="noopener">${contact.url}</a>`
        : reach;

    return `
      <div class="contact">
        ${contact.method.toUpperCase()}: ${callOrLink}
        &nbsp;·&nbsp; ${contact.hours}
        &nbsp;·&nbsp; ${contact.free ? "Free" : "Paid"}
        &nbsp;·&nbsp; ${contact.languages.join(", ")}
      </div>`;
  }

  function renderRecord(r) {
    const contacts = r.contacts.map(renderContact).join("");
    return `
      <div class="card">
        <h3>${r.name}${r.local_name ? ` <span style="font-weight:normal;font-size:0.9em">(${r.local_name})</span>` : ""}</h3>
        <p style="margin:0.3rem 0">${r.description}</p>
        ${contacts}
        <div class="meta">
          Category: ${r.category.replace(/_/g, " ")}
          &nbsp;·&nbsp; Verified: ${r.verified_at}
          ${r.government_backed ? " &nbsp;·&nbsp; Government-backed" : ""}
          ${r.website ? ` &nbsp;·&nbsp; <a href="${r.website}" target="_blank" rel="noopener">Website</a>` : ""}
        </div>
      </div>`;
  }

  async function load() {
    const cc = document.getElementById("country").value;
    const container = document.getElementById("results");
    container.innerHTML = "<p>Loading…</p>";

    const records = await fetchHelplines(cc);

    if (records.length === 0) {
      container.innerHTML =
        "<p>No records found for this country yet. " +
        "<a href='https://github.com/Kouki-odaka/open-helplines/blob/main/CONTRIBUTING.md'>Contribute data →</a></p>";
      return;
    }

    container.innerHTML = records.map(renderRecord).join("");
  }
</script>

</body>
</html>

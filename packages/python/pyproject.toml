[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-helplines"
version = "0.1.0"
description = "Python client for the open-helplines mental health hotline registry"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Kouki-odaka" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "mypy>=1.10.0",
  "ruff>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/Kouki-odaka/open-helplines"
Repository = "https://github.com/Kouki-odaka/open-helplines"
Issues = "https://github.com/Kouki-odaka/open-helplines/issues"

[tool.hatch.build.targets.wheel]
packages = ["open_helplines"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
